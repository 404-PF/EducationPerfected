name: update-command validation (offline fixtures, no publication)
# Native proof for packaging/update.js only. This workflow never tags, uploads or
# publishes a release; the update tests run against local fixture releases.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
          - runner: windows-2025
          - runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
      - name: Run update-command contract tests (offline fixtures)
        run: npm run test:update
