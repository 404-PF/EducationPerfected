name: Downloadable release (owner-approved publication)
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Exact 40-hex main commit to build, gate and publish'
        required: true
        type: string
      tag:
        description: 'Release tag; must equal v + package.json version at that commit'
        required: true
        type: string
      evidence_json:
        description: 'Complete release/evidence.json (schema 2) for the fail-closed release:check gate'
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: downloadable-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate commit, tag and release notes
        env:
          COMMIT: ${{ inputs.source_commit }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$COMMIT" in *[!0-9a-f]*|'') echo 'Expected exact 40-hex source commit'; exit 1;; esac
          [ "${#COMMIT}" -eq 40 ]
          [ "$COMMIT" = "$(git rev-parse HEAD)" ]
          git fetch --depth=1 origin main
          git merge-base --is-ancestor "$COMMIT" FETCH_HEAD
          VERSION=$(jq -r .version package.json)
          [ "$TAG" = "v$VERSION" ]
          [ -f "release/RELEASE-NOTES-$VERSION.md" ]
          [ -z "$(git ls-remote --tags origin "refs/tags/$TAG")" ]
      - name: Ensure no release already exists for the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --silent 2>/dev/null; then
            echo "Release for $TAG already exists"
            exit 1
          fi

  build:
    needs: validate
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, target: linux-x64, exe: educationperfected}
          - {runner: ubuntu-22.04-arm, target: linux-arm64, exe: educationperfected}
          - {runner: windows-2025, target: windows-x64, exe: educationperfected.exe}
          - {runner: macos-15, target: macos-arm64, exe: educationperfected}
          - {runner: macos-15-intel, target: macos-x64, exe: educationperfected}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
      - run: npm ci --ignore-scripts
      - name: Build fresh downloadable candidate and inventory exact bytes
        run: |
          set -euo pipefail
          LABEL="$(date -u '+2026.%-m.%-d')-validation.${GITHUB_RUN_NUMBER}"
          node scripts/beta-candidate.js build-downloadable "$LABEL" "${{ matrix.target }}"
      - name: Upload release candidate bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ matrix.target }}
          path: |
            build/${{ matrix.target }}-downloadable/${{ matrix.exe }}
            build/${{ matrix.target }}-downloadable/THIRD-PARTY-NOTICES
            build/${{ matrix.target }}-downloadable/SHA256SUMS
          retention-days: 1

  gate:
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Stage the owner-approved evidence
        env:
          EVIDENCE_JSON: ${{ inputs.evidence_json }}
        run: |
          set -euo pipefail
          printf '%s' "$EVIDENCE_JSON" | jq empty
          printf '%s' "$EVIDENCE_JSON" > release/evidence.json
      - name: Fail-closed release evidence gate
        run: npm run release:check

  publish:
    needs: [build, gate]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COMMIT: ${{ inputs.source_commit }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Download candidate bundles
        run: |
          set -euo pipefail
          for target in windows-x64 macos-arm64 macos-x64 linux-x64 linux-arm64; do
            gh run download "$GITHUB_RUN_ID" --name "release-candidate-$target" --dir "bundles/$target"
          done
      - name: Verify every bundle byte against its native build inventory
        run: |
          set -euo pipefail
          for target in windows-x64 macos-arm64 macos-x64 linux-x64 linux-arm64; do
            (cd "bundles/$target" && sha256sum -c SHA256SUMS > /dev/null)
          done
      - name: Package release assets with fresh checksums
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          mkdir dist
          for target in windows-x64 macos-arm64 macos-x64 linux-x64 linux-arm64; do
            case "$target" in windows-*) ;; *) chmod +x "bundles/$target/educationperfected";; esac
            (cd "bundles/$target" && zip -q -r "$GITHUB_WORKSPACE/dist/educationperfected-$VERSION-$target.zip" . -x SHA256SUMS)
          done
          (cd dist && sha256sum *.zip > SHA256SUMS)
      - name: Create the GitHub release and tag
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          gh release create "$TAG" --target "$COMMIT" --title "EducationPerfected $VERSION" --notes-file "release/RELEASE-NOTES-$VERSION.md" dist/*.zip dist/SHA256SUMS
