name: Phase 3 Windows native worker store validation
on:
  push:
    branches: [phase3-cli-core]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase3-windows-store-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-store:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
      - name: Record exact source and disposable host
        run: |
          git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'Synthetic source worker CRUD and SEA interactive setup, health read and delete. No browser startup, physical console or no-Node proof.'
      - name: Install pinned dependencies without lifecycle hooks or browser
        run: npm ci --ignore-scripts
      - name: Check Windows workflow fail-fast source policy
        run: python scripts/windows-workflow-policy-test.py
      # pwsh only forwards the final native exit by default; guard each command.
      - name: Check browser-free source controls and bootstrap contracts
        run: |
          node scripts/run-controls-test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/pending-launch-signal-test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/native-store-test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/credential-health-test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/native-resolver-proof-test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/sea-checksum-test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/bootstrap-cleanup-test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # pending-launch dispatches an in-process handler against an inert launch.
      # It is not Windows OS console-event delivery or native browser startup.
      - name: Check synthetic worker ownership contracts
        run: node scripts/packaged-windows-binding-test.js
      - name: Check native fixture cleanup policy with inert state
        run: node scripts/windows-worker-store-policy-test.js
      - name: Check zero-credential ConPTY ownership and ABI with inert APIs
        run: |
          python scripts/windows-conpty-test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/windows-conpty-capability-test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/windows-conpty-checker-test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check actual owned ConPTY capability before any credential mutation
        run: |
          $node = node -p "process.execPath"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/windows-conpty-capability.py $node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise real synthetic native credential operations through workers
        run: node scripts/windows-native-worker-store-test.js
      - name: Check packaged setup receipt and ownership policy with inert state
        run: |
          python scripts/windows-sea-setup-helper-test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/windows-setup-receipt-test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/windows-packaged-store-delete-policy-test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned browser asset for native development SEA build
        run: node node_modules/puppeteer/lib/puppeteer/node/cli.js browsers install chrome
      - name: Build native unsigned development SEA
        run: npm run build:windows-dev
      - name: Exercise packaged synthetic interactive setup, health read and deletion without browser startup
        run: |
          $env:EP_FIXTURE_PYTHON = python -c "import sys; print(sys.executable)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/windows-packaged-store-delete-test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # No real credentials, browser launch, artifacts, account settings or release.
