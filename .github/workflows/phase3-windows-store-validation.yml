name: Phase 3 Windows native worker store validation
on:
  push:
    branches: [phase3-cli-core]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase3-windows-store-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-store:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
      - name: Record exact source and disposable host
        run: |
          git rev-parse HEAD
          node --version
          Write-Output 'Source worker CRUD plus SEA delete-only proof. No browser startup, packaged setup/read, console or no-Node proof.'
      - name: Install pinned dependencies without lifecycle hooks or browser
        run: npm ci --ignore-scripts
      - name: Check synthetic worker ownership contracts
        run: node scripts/packaged-windows-binding-test.js
      - name: Check native fixture cleanup policy with inert state
        run: node scripts/windows-worker-store-policy-test.js
      - name: Check zero-credential ConPTY ownership and ABI with inert APIs
        run: |
          python scripts/windows-conpty-test.py
          python scripts/windows-conpty-capability-test.py
      - name: Check actual owned ConPTY capability before any credential mutation
        run: |
          $node = node -p "process.execPath"
          python scripts/windows-conpty-capability.py $node
      - name: Exercise real synthetic native credential operations through workers
        run: node scripts/windows-native-worker-store-test.js
      - name: Check packaged deletion policy with inert state
        run: node scripts/windows-packaged-store-delete-policy-test.js
      - name: Install pinned browser asset for native development SEA build
        run: node node_modules/puppeteer/lib/puppeteer/node/cli.js browsers install chrome
      - name: Build native unsigned development SEA
        run: npm run build:windows-dev
      - name: Exercise packaged deletion without browser startup
        run: node scripts/windows-packaged-store-delete-test.js
      # No real credentials, browser launch, artifacts, account settings or release.
