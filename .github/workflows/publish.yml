name: Publish
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing empty DRAFT release tag (v<version>) to attach the verified bundle to'
        required: true
        type: string
  release:
    types: [published]

# Attach-only automation. Two entry points, both refusing to touch any release
# that already has assets, and both ending in a manual owner review:
#  - workflow_dispatch (primary): the owner saves an EMPTY draft release, then
#    runs this workflow with its tag. Drafts fire no release events (GitHub
#    limitation), so the button is the only way to reach a draft. The assets
#    are attached to the draft and it STAYS a draft for manual publication.
#    A draft that already has assets is refused: remove them manually to
#    re-attach.
#  - release:published (fallback): if the owner publishes a release directly,
#    the verified assets are attached automatically - but only when the
#    release has zero assets, so this never replaces anything.
# This workflow never creates tags, never edits or publishes a release, never
# replaces or removes assets, and never touches npm.
permissions:
  actions: read
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  attach:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Resolve the release, its commit and whether to attach
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "tag must be v<three numeric parts>, got $TAG"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release.json
          draft=$(jq -r .draft release.json)
          assets=$(jq '.assets | length' release.json)
          target=$(jq -r .target_commitish release.json)
          if [ "$EVENT" = workflow_dispatch ]; then
            [ "$draft" = true ] || { echo "Release $TAG is not a draft; refusing to modify a published release."; exit 1; }
            [ "$assets" -eq 0 ] || { echo "Draft $TAG already has $assets assets; remove them manually to re-attach."; exit 1; }
          else
            if [ "$assets" -ne 0 ]; then
              echo "Release $TAG already has $assets assets; leaving it untouched."
              echo "attach=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          gitapi="repos/$GITHUB_REPOSITORY/git"
          if refjson=$(gh api "$gitapi/ref/tags/$TAG" 2>ref-error.txt); then
            ref=$(echo "$refjson" | jq -r .object.sha)
            if [ "$(echo "$refjson" | jq -r .object.type)" = tag ]; then
              sha=$(gh api "$gitapi/tags/$ref" --jq '.object.sha')
            else
              sha=$ref
            fi
          elif grep -q 'Not Found' ref-error.txt; then
            # A draft's new tag exists only after publication; use the head of
            # the branch the release targets, resolved now.
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$target" --jq '.sha')
          else
            echo "Tag ref lookup failed for $TAG:"; cat ref-error.txt; exit 1
          fi
          echo "$sha" | grep -qE '^[0-9a-f]{40}$' || { echo "could not resolve a commit for $TAG"; exit 1; }
          echo "attach=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Find the staging bundle built from that commit
        id: bundle
        if: steps.plan.outputs.attach == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.plan.outputs.version }}
          SHA: ${{ steps.plan.outputs.sha }}
        run: |
          set -euo pipefail
          want="release-bundle-v$VERSION-$SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&name=$want" > artifacts.json
          filter='[.artifacts[] | select(.name == $n and (.expired | not) and .workflow_run.head_sha == $s)]'
          if [ "$(jq --arg n "$want" --arg s "$SHA" "$filter | length" artifacts.json)" -lt 1 ]; then
            echo "No usable staging bundle $want. Run Release bundle staging for that commit first (or check the target branch has not moved since the release was created)."
            exit 1
          fi
          latest=$(jq -r --arg n "$want" --arg s "$SHA" "$filter | sort_by(.created_at) | last | [.id, .workflow_run.id] | @tsv" artifacts.json)
          id=${latest%%$'\t'*}
          runid=${latest##*$'\t'}
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$runid" > staging-run.json
          path=$(jq -r .path staging-run.json)
          [ "$path" = .github/workflows/release-bundle-staging.yml ] || { echo "bundle artifact came from $path, not release-bundle-staging.yml"; exit 1; }
          [ "$(jq -r .conclusion staging-run.json)" = success ] || { echo "staging run $runid was not green"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Download and verify the bundle
        if: steps.plan.outputs.attach == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ steps.bundle.outputs.id }}
        run: |
          set -euo pipefail
          # Two-step download: the API replies with a signed redirect; the token
          # is never sent to the redirect target.
          url=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" -o /dev/null -w '%{redirect_url}' \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip")
          test -n "$url"
          curl -sf "$url" -o bundle.zip
          entries=$(unzip -Z1 bundle.zip | wc -l)
          if [ "$entries" -ne 22 ]; then echo "Expected 22 bundle entries (21 payloads + SHA256SUMS), found $entries"; exit 1; fi
          mkdir bundle
          unzip -q bundle.zip -d bundle
          (cd bundle && sha256sum -c SHA256SUMS)
      - name: Attach the verified files to the release
        if: steps.plan.outputs.attach == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # Final guard, checked immediately before upload on both paths: never
          # attach over existing assets.
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets | length')
          [ "$assets" -eq 0 ] || { echo "Release $TAG gained $assets assets since the run started; refusing to attach."; exit 1; }
          cd bundle
          gh release upload "$TAG" -- *
          count=$(gh release view "$TAG" --json assets --jq '.assets | length')
          echo "Attached $count assets to $TAG. Publication stays manual; this workflow only attaches files."
