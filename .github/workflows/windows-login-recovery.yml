name: Windows initial login recovery experiment
on:
  pull_request:
    paths:
      - scripts/windows-fixture-profile.js
      - scripts/windows-network-sandbox.js
      - scripts/windows-fixture-profile-test.js
      - lib/initial-login-navigation.js
      - scripts/initial-login-navigation-test.js
      - scripts/windows-navigation-panel.js
      - .github/workflows/windows-login-recovery.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery-experiment:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
      - run: npm ci --ignore-scripts
      - run: node scripts/windows-fixture-profile-test.js
      - name: Inert recovery boundaries
        run: node scripts/initial-login-navigation-test.js
      - name: Local-only baseline and six independent recovered starts
        run: node scripts/windows-navigation-panel.js
