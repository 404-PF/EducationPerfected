name: Phase 3 Windows SEA experiment
on:
  push:
    branches: [phase3-windows-experiment]
permissions:
  contents: read
concurrency:
  group: phase3-windows-experiment
  cancel-in-progress: true
jobs:
  windows-development-experiment:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
      - name: Install pinned dependencies and browser
        run: npm ci
      - name: Test fixture cleanup error precedence
        run: node scripts/fixture-cleanup-errors-test.js
      - name: Test Windows binding worker lifecycle with synthetic workers
        run: node scripts/packaged-windows-binding-test.js
      - name: Build local unsigned Windows development executable
        run: node packaging/build-windows.js
      - name: Test checksum gate with synthetic assets
        run: node scripts/sea-checksum-test.js
      - name: Exercise actual packaged Windows CLI with local fixture only
        run: node scripts/packaged-cli-test.js
