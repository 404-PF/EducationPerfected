name: Source regression contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: source-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
      - name: Install pinned dependencies without lifecycle hooks
        run: npm ci --ignore-scripts
      - name: Install pinned local-test browser
        run: node node_modules/puppeteer/lib/puppeteer/node/cli.js browsers install chrome-headless-shell
      - name: Test controls, startup, signal drain, CLI and cleanup restart
        run: npm run test:phase3
