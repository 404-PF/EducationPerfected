name: Phase 3 SEA asset experiment
on:
  push:
    branches: [phase3-sea-asset-experiment]
permissions:
  contents: read
concurrency:
  group: phase3-sea-asset-experiment
  cancel-in-progress: true
jobs:
  linux-x64-experiment:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
      - name: Install pinned dependencies and browser
        run: npm ci
      - name: Build full browser as SEA asset
        run: npm run build:linux-dev
      - name: Diagnose runner browser prerequisites without weakening sandbox
        run: |
          browser=$(node -e 'require("puppeteer").executablePath({headless:"shell"}).then(p=>console.log(p)).catch(()=>process.exit(1))')
          "$browser" --version
          ldd "$browser" > /tmp/ep-browser-libraries.txt
          if grep 'not found' /tmp/ep-browser-libraries.txt; then exit 1; fi
          node <<'JS'
          const puppeteer = require('puppeteer');
          (async () => {
            let browser, timer;
            try {
              browser = await puppeteer.launch({headless: 'shell', dumpio: true, timeout: 15000});
              console.log(await browser.version());
            } finally {
              if (browser) {
                const exited = new Promise(resolve => browser.process().once('exit', resolve));
                try {
                  await Promise.race([browser.close(), new Promise((_,reject) => {timer=setTimeout(()=>reject(new Error('Diagnostic browser close timed out')),5000);})]);
                } finally {
                  clearTimeout(timer);
                  if (browser.process().exitCode === null && browser.process().signalCode === null) {
                    browser.process().kill('SIGKILL');
                    await Promise.race([exited,new Promise(resolve=>{timer=setTimeout(resolve,2000);})]);
                    clearTimeout(timer);
                  }
                }
              }
            }
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          JS
      - name: Exercise actual packaged CLI with embedded browser
        run: |
          command -v Xvfb
          command -v xvfb-run
          xvfb-run -a npm run test:packaged
      - name: Confirm temporary extraction cleanup
        if: always()
        run: |
          if find /tmp -maxdepth 1 -type d -name 'ep-packaged-test-*' -print -quit | grep -q .; then
            echo 'Packaged test left temporary residue'
            exit 1
          fi
