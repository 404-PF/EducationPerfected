name: Phase3 single modified normal saved-read observation
on:
  push:
    branches: [ep-normal-read-once-reviewed]
permissions:
  contents: read
concurrency:
  group: ep-normal-read-once-reviewed
  cancel-in-progress: false
jobs:
  single-linux-x64:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - name: Install public pinned build prerequisites only
        run: |
          set -eu
          npm ci --ignore-scripts > "$RUNNER_TEMP/dependency-install.log" 2>&1
          node node_modules/puppeteer/lib/puppeteer/node/cli.js browsers install chrome > "$RUNNER_TEMP/browser-download.log" 2>&1
          sudo apt-get update > "$RUNNER_TEMP/package-update.log" 2>&1
          sudo apt-get install -y --no-install-recommends dbus-x11 gnome-keyring libglib2.0-bin xvfb xauth > "$RUNNER_TEMP/package-install.log" 2>&1
      - name: Build owned modified fixture, never launch outside boundary
        run: |
          set -eu
          node scripts/normal-read-fixture/bundle.js > "$RUNNER_TEMP/bundle.log" 2>&1
          node scripts/normal-read-fixture/attribution.js
          node scripts/normal-read-fixture/build-sea-private.js > "$RUNNER_TEMP/build.log" 2>&1
          python3 - <<'PY'
          import json,pathlib
          m=json.loads(pathlib.Path('build/linux-x64-normal-read-fixture-private/PRIVATE-FIXTURE.json').read_text())
          print('EP_MODIFIED_FIXTURE_SHA256='+m['sha256'])
          print('EP_FIXTURE_MAIN_SHA256='+m['mainSha256'])
          PY
      - name: Admit boundary and conditionally observe exactly one synthetic normal login
        run: |
          set -eu
          test "$(id -u)" != 0
          env -i PATH=/usr/bin:/usr/sbin:/bin:/sbin LANG=C python3 scripts/normal-read-fixture/enter-boundary.py
      - name: Remove ephemeral build and raw owned logs, no upload
        if: always()
        run: |
          rm -rf build/normal-read-review build/linux-x64-normal-read-fixture-private
          rm -f "$RUNNER_TEMP/dependency-install.log" "$RUNNER_TEMP/browser-download.log" "$RUNNER_TEMP/package-update.log" "$RUNNER_TEMP/package-install.log" "$RUNNER_TEMP/bundle.log" "$RUNNER_TEMP/build.log"
