name: Phase3 Mac network capability only
on:
  push:
    branches: [ep-normal-read-once-reviewed]
permissions:
  contents: read
concurrency:
  group: ep-normal-read-once-reviewed
  cancel-in-progress: false
jobs:
  mac-network-capability:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fixed network-only sandbox and child-inheritance capability probe
        run: |
          set -eu
          python3 scripts/macos-network-capability/run.py
      # No dependencies, build, keychain, browser, product, artifact upload or release.
