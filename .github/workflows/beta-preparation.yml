name: V2026 beta build preparation (no publication)
on:
  workflow_dispatch:
    inputs:
      candidate_version:
        description: 'Candidate label, 2026.M.D-beta.N (no tag or release created)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: beta-preparation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
          - runner: windows-2025
            target: windows-x64
          - runner: macos-15
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.runner }}
    env:
      CANDIDATE_VERSION: ${{ inputs.candidate_version }}
      CANDIDATE_TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
      - name: Validate candidate label, clean source and native host
        run: node scripts/beta-candidate.js check "$CANDIDATE_VERSION" "$CANDIDATE_TARGET"
      - name: Install pinned dependencies without lifecycle hooks
        run: npm ci --ignore-scripts
      - name: Run build-preparation contracts
        run: |
          set -euo pipefail
          npm run test:beta-preparation
          npm run test:release-gate
          node scripts/sea-checksum-test.js
          node scripts/build-preflight-test.js
      - name: Install pinned browser explicitly
        run: node node_modules/puppeteer/lib/puppeteer/node/cli.js browsers install chrome
      - name: Build fresh native candidate and inventory exact bytes
        run: node scripts/beta-candidate.js build "$CANDIDATE_VERSION" "$CANDIDATE_TARGET"
      # Intentionally no upload-artifact, tag, release, saved-login, no-Node or
      # signing-policy validation. Existing release:check is not bypassed.
      # Executable and notices remain ephemeral in this runner's build directory.
