name: V2026 stable-release preparation (no publication)
on:
  workflow_dispatch:
    inputs:
      validation_label:
        description: 'Internal build label, 2026.M.D-validation.N (not a public release version)'
        required: true
        type: string
      upload_windows_test:
        description: 'Upload unsigned Windows internal test build for 7 days (readable by signed-in GitHub users)'
        required: true
        default: false
        type: boolean
      upload_candidate_bundles:
        description: 'Upload every target downloadable candidate (executable, notices, SHA256SUMS) for 90 days, for manual owner publication'
        required: true
        default: false
        type: boolean
      browser_mode:
        description: 'Embedded development build or direct-download native validation (test upload is a separate opt-in)'
        required: true
        default: embedded-development
        type: choice
        options:
          - embedded-development
          - direct-download-validation
permissions:
  contents: read
concurrency:
  group: beta-preparation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      VALIDATION_LABEL: ${{ inputs.validation_label }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
      - name: Validate label before allocating native build matrix
        run: node scripts/beta-candidate.js check "$VALIDATION_LABEL" linux-x64
  candidate:
    needs: validate
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
          - runner: windows-2025
            target: windows-x64
          - runner: macos-15
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.runner }}
    env:
      VALIDATION_LABEL: ${{ inputs.validation_label }}
      CANDIDATE_TARGET: ${{ matrix.target }}
      BROWSER_MODE: ${{ inputs.browser_mode }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
      - name: Validate candidate label, clean source and native host
        run: node scripts/beta-candidate.js check "$VALIDATION_LABEL" "$CANDIDATE_TARGET"
      - name: Install pinned dependencies without lifecycle hooks
        run: npm ci --ignore-scripts
      - name: Run build-preparation contracts
        run: |
          set -euo pipefail
          npm run test:beta-preparation
          npm run test:release-gate
          node scripts/sea-checksum-test.js
          node scripts/build-preflight-test.js
          node scripts/packaged-startup-evidence-test.js
          node scripts/test-startup-failure-test.js
          node scripts/windows-navigation-panel-test.js
          node scripts/runtime-directory-test.js
          if [ "$RUNNER_OS" = Windows ]; then python_bin=python; else python_bin=python3; fi
          "$python_bin" scripts/windows-conpty-test.py
          "$python_bin" scripts/downloadable-first-run-windows-test.py
      - name: Install pinned browser explicitly
        if: inputs.browser_mode != 'direct-download-validation'
        run: node node_modules/puppeteer/lib/puppeteer/node/cli.js browsers install chrome
      - name: Build fresh native candidate and inventory exact bytes
        id: candidate_build
        run: |
          set -euo pipefail
          if [ "$BROWSER_MODE" = direct-download-validation ]; then
            node scripts/beta-candidate.js build-downloadable "$VALIDATION_LABEL" "$CANDIDATE_TARGET"
          else
            node scripts/beta-candidate.js build "$VALIDATION_LABEL" "$CANDIDATE_TARGET"
          fi
      - name: Build the per-user Windows installer
        if: inputs.browser_mode == 'direct-download-validation' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 (ISCC.exe) not found on this runner image.' }
          $version = node -p "require('./package.json').version"
          $root = (Get-Location).Path
          $out = Join-Path $root 'build\windows-x64-downloadable'
          $src = Join-Path $out 'educationperfected.exe'
          $iss = Join-Path $root 'installer\windows-setup.iss'
          & $iscc "/DAppVersion=$version" "/DSourceExe=$src" "/DOutputDir=$out" $iss | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage explicitly requested Windows internal test package
        id: test_package
        if: inputs.upload_windows_test && inputs.browser_mode == 'direct-download-validation' && runner.os == 'Windows'
        run: node scripts/stage-windows-test-artifact.js
      - name: Checksum the Windows installer
        if: inputs.browser_mode == 'direct-download-validation' && runner.os == 'Windows'
        run: |
          cd build/windows-x64-downloadable
          sha256sum educationperfected-setup-windows-x64.exe >> SHA256SUMS
      - name: Install rpm tooling for Linux package lanes
        if: inputs.browser_mode == 'direct-download-validation' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm rpm2cpio
      - name: Build and byte-verify platform packages
        if: inputs.browser_mode == 'direct-download-validation' && runner.os != 'Windows'
        run: |
          version=$(node -p "require('./package.json').version")
          scripts/build-packages.sh "$CANDIDATE_TARGET" "$version" "build/$CANDIDATE_TARGET-downloadable/educationperfected" "build/$CANDIDATE_TARGET-downloadable"
      - name: Pack the npm installer package
        if: inputs.browser_mode == 'direct-download-validation' && matrix.target == 'linux-x64'
        run: |
          version=$(node -p "require('./package.json').version")
          (cd npm/educationperfected && npm pack --pack-destination "../../build/$CANDIDATE_TARGET-downloadable" >/dev/null)
          test -f "build/$CANDIDATE_TARGET-downloadable/educationperfected-$version.tgz"
      - name: Checksum the platform packages
        if: inputs.browser_mode == 'direct-download-validation' && runner.os != 'Windows'
        run: |
          cd "build/$CANDIDATE_TARGET-downloadable"
          for f in educationperfected-*.pkg educationperfected_*.deb educationperfected-*.rpm educationperfected-*.tgz; do
            if [ -e "$f" ]; then sha256sum "$f" >> SHA256SUMS; fi
          done
      - name: Exercise install.sh end-to-end against the local candidate
        if: inputs.browser_mode == 'direct-download-validation' && runner.os != 'Windows'
        run: |
          dist=$(mktemp -d)
          cp "build/$CANDIDATE_TARGET-downloadable/educationperfected" "$dist/educationperfected-$CANDIDATE_TARGET"
          (cd "$dist" && sha256sum -- * > SHA256SUMS)
          home=$(mktemp -d)
          EP_INSTALL_BASE_URL="file://$dist" HOME="$home" sh installer/install.sh test-version
          "$home/.local/bin/educationperfected" version | head -1
      - name: Exercise the npm package end-to-end against the local candidate
        if: inputs.browser_mode == 'direct-download-validation' && matrix.target == 'linux-x64'
        run: |
          version=$(node -p "require('./package.json').version")
          dist=$(mktemp -d)
          cp "build/$CANDIDATE_TARGET-downloadable/educationperfected" "$dist/educationperfected-$CANDIDATE_TARGET"
          (cd "$dist" && sha256sum -- * > SHA256SUMS)
          app=$(mktemp -d) && cd "$app" && npm init -y >/dev/null
          EP_INSTALL_BASE_URL="file://$dist" npm install "$OLDPWD/build/$CANDIDATE_TARGET-downloadable/educationperfected-$version.tgz" >/dev/null
          "./node_modules/.bin/educationperfected" version | head -1
      - name: Exercise install.ps1 end-to-end against the local candidate
        if: inputs.browser_mode == 'direct-download-validation' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'ep-dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item 'build\windows-x64-downloadable\educationperfected.exe' (Join-Path $dist 'educationperfected-windows-x64.exe')
          $hash = (Get-FileHash -Algorithm SHA256 (Join-Path $dist 'educationperfected-windows-x64.exe')).Hash.ToLowerInvariant()
          "$hash  educationperfected-windows-x64.exe" | Set-Content (Join-Path $dist 'SHA256SUMS')
          $env:EP_INSTALL_BASE_URL = $dist
          & installer\install.ps1 -Version test-version
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\EducationPerfected\educationperfected.exe'
          if (-not (Test-Path $installed)) { throw 'install.ps1 did not install the executable' }
      - name: Upload explicitly requested downloadable candidate bundle
        if: ${{ !cancelled() && steps.candidate_build.outcome == 'success' && inputs.upload_candidate_bundles && inputs.browser_mode == 'direct-download-validation' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: downloadable-candidate-${{ matrix.target }}-${{ github.sha }}
          path: |
            build/${{ matrix.target }}-downloadable/educationperfected*
            build/${{ matrix.target }}-downloadable/THIRD-PARTY-NOTICES
            build/${{ matrix.target }}-downloadable/SHA256SUMS
          retention-days: 90
          if-no-files-found: error
      - name: Upload explicitly requested unsigned Windows test package
        if: inputs.upload_windows_test && steps.test_package.outcome == 'success' && inputs.browser_mode == 'direct-download-validation' && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-internal-test-${{ github.sha }}
          path: build/windows-internal-test/
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
      - name: Direct-download offline contracts
        if: inputs.browser_mode == 'direct-download-validation'
        run: npm run test:browser-download
      - name: Start virtual display for Linux local browser fixture
        if: inputs.browser_mode == 'direct-download-validation' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb x11-utils
          Xvfb :99 -screen 0 1280x1024x24 > "$RUNNER_TEMP/ep-xvfb.log" 2>&1 &
          ready=0
          for attempt in $(seq 1 50); do
            if DISPLAY=:99 xdpyinfo > "$RUNNER_TEMP/ep-display.log" 2>&1; then ready=1; break; fi
            sleep 0.2
          done
          [ "$ready" -eq 1 ] || { echo 'Virtual display did not become ready'; exit 1; }
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Observe exact downloadable SEA against local fixture
        if: inputs.browser_mode == 'direct-download-validation'
        run: node scripts/downloadable-cli-test.js
      - name: Actual SEA first-run interactive consent and direct acquisition
        if: inputs.browser_mode == 'direct-download-validation' && runner.os != 'Windows'
        run: python3 scripts/downloadable-first-run-posix.py
      - name: Windows actual SEA first-run public consent and direct acquisition
        if: ${{ !cancelled() && steps.candidate_build.outcome == 'success' && inputs.browser_mode == 'direct-download-validation' && runner.os == 'Windows' }}
        run: python scripts/downloadable-first-run-windows.py
      - name: Windows independent before versus after owned Chrome sandbox setup
        if: ${{ !cancelled() && steps.candidate_build.outcome == 'success' && inputs.browser_mode == 'direct-download-validation' && runner.os == 'Windows' }}
        run: node scripts/windows-navigation-panel.js
      - name: Select exact downloadable artifact for existing credential fixtures
        id: store_candidate
        if: ${{ !cancelled() && steps.candidate_build.outcome == 'success' && inputs.browser_mode == 'direct-download-validation' }}
        run: node scripts/stage-downloadable-store-fixture.js
      - name: Prepare private Linux credential-store prerequisites
        if: inputs.browser_mode == 'direct-download-validation' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus-x11 gnome-keyring libglib2.0-bin
      - name: Linux exact SEA private native-store setup and deletion
        if: inputs.browser_mode == 'direct-download-validation' && runner.os == 'Linux'
        run: sh scripts/packaged-store-integration.sh
      - name: macOS exact SEA owned-keychain setup health and deletion
        if: inputs.browser_mode == 'direct-download-validation' && runner.os == 'macOS'
        run: python3 scripts/macos-isolated-store-test.py
      - name: Windows exact SEA hosted synthetic setup health and deletion
        if: ${{ !cancelled() && steps.store_candidate.outcome == 'success' && inputs.browser_mode == 'direct-download-validation' && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $env:EP_FIXTURE_PYTHON = python -c "import sys; print(sys.executable)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/windows-packaged-store-delete-test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # No tag, release, normal saved-login, no-Node or
      # signing-policy validation. Existing release:check is not bypassed.
      # Explicitly requested candidate bundles are retained for 90 days and the
      # Windows test package for 7 days; publication stays a manual owner act.
      # Other build files remain ephemeral in this runner's build directory.
