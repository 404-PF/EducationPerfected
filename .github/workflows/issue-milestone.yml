name: issue-milestone

# Assigns the closest open [v*.*.*] milestone to every newly opened issue
# (#880). "Closest" is the lowest still-open version; titles that do not match
# v*.*.* are ignored. When that milestone already holds >= 30 issues
# (open + closed) at assignment time, the next patch milestone is assigned
# instead, created on demand if it does not exist yet (v0.5.3 full ->
# v0.5.4). Closed milestones are never reopened or reused: a closed version
# was released, so new work rolls forward to the next patch instead.
# Bot-created issues are skipped on purpose: bots do not triage, so a
# milestone would never be acted on and would only churn the cap count.

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to assign a milestone to'
        required: true
        type: number

# One shared group (not per-issue): concurrent opens must serialize so each
# run re-reads milestone counts after earlier assignments and rolls over
# correctly once a milestone hits the 30-issue cap. cancel-in-progress is
# false so a queued run waits instead of being cancelled, and queue: max keeps
# up to 100 runs pending. GitHub drops the oldest pending run beyond that
# limit, so an extreme burst can lose an assignment; replay any issue left
# without a milestone via workflow_dispatch.
concurrency:
  group: issue-milestone
  cancel-in-progress: false
  queue: max

jobs:
  milestone:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Assign closest milestone
        # Below the 5-minute job timeout so a hung API call fails this step
        # (and reaches the failure report) instead of being cancelled with the
        # job, where GitHub cannot distinguish a timeout from a manual cancel.
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          MILESTONE_LIMIT: 30
        run: |
          set -euo pipefail

          # Re-read the issue instead of trusting the event payload: a manual
          # dispatch carries no issue at all, so this is also the only place
          # the author type and the current milestone are known on that path.
          ISSUE_JSON="$(gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER")"
          ISSUE_USER_TYPE="$(jq -r '.user.type // empty' <<< "$ISSUE_JSON")"
          if [ "$ISSUE_USER_TYPE" = 'Bot' ]; then
            echo 'Bot-created issue; skipping milestone assignment.'
            exit 0
          fi

          # Idempotency: never overwrite a milestone a human already set.
          CURRENT="$(jq -r '.milestone.number // 0' <<< "$ISSUE_JSON")"
          if [ "$CURRENT" != '0' ]; then
            echo "Issue #$ISSUE_NUMBER already has milestone #$CURRENT; skipping."
            exit 0
          fi

          bump() {
            jq -rn --arg t "$1" \
              '$t | ltrimstr("v") | split(".") | .[2] = ((.[2] | tonumber) + 1 | tostring) | "v" + join(".")'
          }

          FILE="$RUNNER_TEMP/milestones.json"
          # Milestone titles are untrusted data: keep only strict v*.*.*
          # titles, sorted ascending as semver.
          # --slurp flattens paginated responses into one array; the filter
          # and sort run in the piped jq below because gh api rejects
          # --slurp combined with --jq. Every milestone even past the first
          # 100 is therefore still present in the file.
          gh api --paginate --slurp "repos/$GH_REPO/milestones?state=all&per_page=100" \
            | jq '[.[][] | select(.title | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(.title | ltrimstr("v") | split(".") | map(tonumber))' \
            > "$FILE"

          if [ "$(jq 'length' "$FILE")" -eq 0 ]; then
            # Bootstrap: this repository had no milestone at all, so there is
            # no "closest" version to inherit. Start the chain at the patch
            # after the latest release instead of failing every new issue.
            LATEST="$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name // empty' 2>/dev/null || true)"
            if [[ "$LATEST" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              TITLE="$(bump "$LATEST")"
              echo "No v*.*.* milestone exists; starting the chain at $TITLE (after release $LATEST)."
            else
              echo '::error::No v*.*.* milestone or release exists; cannot choose a closest version.'
              exit 1
            fi
          else
            # Closest = lowest still-open version. With nothing open, continue
            # the chain from the highest known version.
            TITLE="$(jq -r 'map(select(.state == "open")) | first | .title // empty' "$FILE")"
            if [ -z "$TITLE" ]; then
              TITLE="$(bump "$(jq -r 'last | .title' "$FILE")")"
              echo "No open milestone; continuing with $TITLE."
            fi
          fi

          milestone_state() {
            jq -r --arg t "$1" 'map(select(.title == $t)) | first | .state // empty' "$FILE"
          }
          milestone_total() {
            jq -r --arg t "$1" 'map(select(.title == $t)) | first | (.open_issues + .closed_issues) // 0' "$FILE"
          }

          # Count is read from the just-fetched list at assignment time; the
          # shared concurrency group above keeps concurrent runs from both
          # landing on a milestone that hits the cap between read and write.
          # Keep advancing while the target already holds >= 30 issues or is
          # closed: a bumped title may itself be full, and a closed title was
          # released, so reopening it would silently move new work into an
          # old release. A title that is absent from the list counts as 0 and
          # is not closed, which ends the loop.
          STATE="$(milestone_state "$TITLE")"
          TOTAL="$(milestone_total "$TITLE")"
          while [ "$TOTAL" -ge "$MILESTONE_LIMIT" ] || [ "$STATE" = 'closed' ]; do
            if [ "$STATE" = 'closed' ]; then
              echo "Milestone $TITLE is closed (already released); rolling over."
            else
              echo "Milestone is full ($TOTAL >= $MILESTONE_LIMIT); rolling over."
            fi
            TITLE="$(bump "$TITLE")"
            STATE="$(milestone_state "$TITLE")"
            TOTAL="$(milestone_total "$TITLE")"
          done

          # Reuse only an open milestone; create the title when nothing open
          # carries it yet.
          NUMBER="$(jq -r --arg t "$TITLE" 'map(select(.title == $t and .state == "open")) | first | .number // empty' "$FILE")"
          if [ -z "$NUMBER" ]; then
            echo "Creating milestone $TITLE."
            NUMBER="$(gh api "repos/$GH_REPO/milestones" -f title="$TITLE" -f state=open --jq .number)"
          fi

          # Re-read immediately before the write: milestone discovery and
          # creation are network round trips during which a human may have set
          # a milestone by hand, and this PATCH would otherwise overwrite it.
          CURRENT="$(gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER" --jq '.milestone.number // 0')"
          if [ "$CURRENT" != '0' ]; then
            echo "Issue #$ISSUE_NUMBER gained milestone #$CURRENT while this run was choosing one; preserving the human assignment."
            exit 0
          fi

          gh api -X PATCH "repos/$GH_REPO/issues/$ISSUE_NUMBER" -F milestone="$NUMBER" >/dev/null
          echo "Assigned $TITLE (#$NUMBER) to issue #$ISSUE_NUMBER."

      # Tell the requester when a run they explicitly asked for fails.
      # issues.opened stays silent to avoid noise on new issues.
      - name: Report milestone failure on issue
        if: failure() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" \
            --body "Issue milestone assignment failed. See the workflow run: $RUN_URL"
