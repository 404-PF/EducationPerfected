# SonarQube Cloud automatic-analysis scope.
#
# V1_Archive/ and V2_Archive/ are frozen, read-only snapshots of earlier
# releases: V1 is the original userscript implementation, while V2 is a
# byte-for-byte copy of the program that still lives at the repository root.
# They are kept for reference and are never edited, so analyzing them only
# re-reports archived findings that cannot be fixed without invalidating the
# snapshot - and, for V2, counts every archived line as duplication of the live
# root it mirrors. Only the live root is analyzed; fixes belong there.
sonar.exclusions=V1_Archive/**/*,V2_Archive/**/*
