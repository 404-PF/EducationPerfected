# SonarQube Cloud automatic-analysis scope.
#
# V1_Archive/ and V2_Archive/ are frozen, read-only snapshots of earlier
# releases. Their contents are intentionally byte-for-byte copies of code that
# also lives (and keeps changing) at the repository root, so analyzing them
# reports every archived line as duplication on new code and re-raises findings
# that cannot be fixed without invalidating the snapshot. Only the live root is
# analyzed; fixes belong there.
sonar.exclusions=V1_Archive/**/*,V2_Archive/**/*
